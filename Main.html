
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>❤️❤️</title>

<style>
  :root {
    --bg: #fff;
    --text: #111;
    --muted: #666;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111;
      --text: #eee;
      --muted: #999;
    }
  }

  body {
    margin: 0;
    min-height: 100vh;
    padding: 2rem 1rem;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1.5rem;
    font-family: system-ui, sans-serif;
    text-align: center;
    background: var(--bg);
    color: var(--text);
  }

  .hearts {
    font-size: 2.5rem;
    letter-spacing: .3rem;
  }

  .nose {
    position: relative;
    font-size: 6rem;
    line-height: 1;
  }

  .nose-empty {
    filter: brightness(0) opacity(.12);
  }

  @media (prefers-color-scheme: dark) {
    .nose-empty {
      filter: brightness(0) invert(1) opacity(.15);
    }
  }

  #label {
    color: var(--muted);
    font-size: 1.2rem;
  }

  #time {
    font-size: 2.6rem;
    font-weight: 300;
    letter-spacing: .1em;
  }
</style>
</head>

<body>

  <div class="hearts">❤️❤️</div>

  <div class="nose">
    <span class="nose-empty">👃</span>
  </div>

  <p id="label">…</p>

  <div id="time">…</div>

</body>
</html>
