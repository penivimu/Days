<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Countdown</title>
<style>
  :root {
    --bg: #fff;
    --text: #111;
    --muted: #666;
    --empty: #ececec;
    --filled: #e9a46a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111;
      --text: #eee;
      --muted: #999;
      --empty: #222;
      --filled: #c8844d;
    }
  }
  body {
    margin: 0;
    min-height: 100vh;
    padding: 2rem 1rem;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1.5rem;
    font-family: system-ui, sans-serif;
    text-align: center;
    background: var(--bg);
    color: var(--text);
  }
  #calendar {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 1.5rem 2rem;
  }
  .month-name { font-size: .8rem; color: var(--muted); margin-bottom: .4rem; text-align: left; }
  .days { display: grid; grid-template-columns: repeat(7, 16px); gap: 4px; }
  .day { width: 16px; height: 16px; border-radius: 3px; background: var(--empty); }
  .nose { position: relative; font-size: 6rem; line-height: 1; }
  .nose-empty { filter: brightness(0) opacity(.12); }
  .nose-full { position: absolute; left: 0; top: 0; }
  @media (prefers-color-scheme: dark) {
    .nose-empty { filter: brightness(0) invert(1) opacity(.15); }
  }
  #time {
    margin-top: 0;
    font-size: 2.6rem;
    font-weight: 300;
    letter-spacing: .05em;
    font-variant-numeric: tabular-nums;
  }
  p { margin: 0; color: var(--muted); }
</style>
</head>
<body>
  <div id="calendar"></div>
  <div class="nose">
    <span class="nose-empty">👃</span>
    <span class="nose-full" id="nose-full">👃</span>
  </div>
  <p id="label"></p>
  <div id="time"></div>

<script>
  const year = new Date().getFullYear();
  const start = new Date(year, 7, 21, 0, 0, 0);   // Aug 21
  const end = new Date(year, 10, 7, 17, 20, 0);   // Nov 7, 17:20
  const DAY = 86400000;
  const DURATION = 2500;                          // intro animation (ms)

  const noseFull = document.getElementById("nose-full");
  const label = document.getElementById("label");

  function progress() {
    return Math.min(1, Math.max(0, (new Date() - start) / (end - start)));
  }

  // Countdown
  function tick() {
    const left = Math.max(0, end - new Date());
    const d = Math.floor(left / DAY);
    const h = Math.floor(left / 3600000) % 24;
    const m = Math.floor(left / 60000) % 60;
    const s = Math.floor(left / 1000) % 60;
    const pad = n => String(n).padStart(2, "0");
    document.getElementById("time").textContent = `${pad(d)}:${pad(h)}:${pad(m)}:${pad(s)}`;
  }
  tick();
  setInterval(tick, 1000);

  // Background calendar: one square per day, grouped by month
  const calendar = document.getElementById("calendar");
  const squares = [];
  const now = new Date();
  let grid = null, lastMonth = -1;

  const lastDay = new Date(end.getFullYear(), end.getMonth() + 1, 0);
  for (let t = new Date(start.getFullYear(), start.getMonth(), 1); t <= lastDay; t = new Date(t.getFullYear(), t.getMonth(), t.getDate() + 1)) {
    if (t.getMonth() !== lastMonth) {
      lastMonth = t.getMonth();
      const block = document.createElement("div");
      block.innerHTML = `<div class="month-name">${t.toLocaleString("en", { month: "long" })}</div>`;
      grid = document.createElement("div");
      grid.className = "days";
      block.appendChild(grid);
      calendar.appendChild(block);
    }
    const sq = document.createElement("div");
    sq.className = "day";
    if (grid.children.length === 0) sq.style.gridColumnStart = (t.getDay() + 6) % 7 + 1; // Monday first
    grid.appendChild(sq);

    if (t < start || t > end) { sq.style.visibility = "hidden"; continue; }  // outside the range

    const dayStart = t.getTime();
    const dayEnd = Math.min(dayStart + DAY, end.getTime());
    squares.push({ sq, fraction: Math.min(1, Math.max(0, (now - dayStart) / (dayEnd - dayStart))) });
  }

  // Intro animation: nose, percentage and squares fill up to where they belong
  const elapsedDays = squares.reduce((sum, item) => sum + item.fraction, 0);
  const target = progress() * 100;
  const t0 = performance.now();

  function animate(t) {
    const p = Math.min(1, (t - t0) / DURATION);
    const eased = 1 - Math.pow(1 - p, 3);
    const current = target * eased;
    noseFull.style.clipPath = `inset(${100 - current}% 0 0 0)`;
    label.textContent = `${current.toFixed(1)}% complete`;

    // squares fill in order, in sync with the percentage
    const filledDays = elapsedDays * eased;
    squares.forEach((item, i) => {
      const f = Math.min(item.fraction, Math.min(1, Math.max(0, filledDays - i)));
      item.sq.style.background = f > 0
        ? `linear-gradient(to top, var(--filled) ${f * 100}%, var(--empty) ${f * 100}%)`
        : "";
    });

    if (p < 1) requestAnimationFrame(animate);
  }
  noseFull.style.clipPath = "inset(100% 0 0 0)";
  requestAnimationFrame(animate);
</script>
</body>
</html>
